<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Signup page</title>
    <link rel="stylesheet" href="login&singup_style.css">
    <style>

    </style>
</head>

<body>
        <form id="signup-form" method="post">
            <fieldset>
                <legend>Register</legend>

                <input type="text" id="signup-name" placeholder="User name" maxlength="20" required> <br>
                <input type="email" id="signup-email" placeholder="Email" required> <br>

                <input type="password" id="signup-password" placeholder="Password" minlength="8" required> <br>
                <input type="password" id="confirm-password" placeholder="Confirm Password" minlength="8" required> <br>

                <button id="signup-button" class="button" type="submit">Register</button>

                <p>have an account? <a href="login.html">Login now</a></p>

            </fieldset>
        </form>


</body>

</html>
