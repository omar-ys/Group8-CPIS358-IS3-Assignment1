<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Signup page</title>
    <link rel="stylesheet" href="login&singup_style.css">
</head>

<body>

    <form id="signup-form" onsubmit="return signupUser()">
        <fieldset>
            <legend>Register</legend>
            
            <input id="username" type="text" placeholder="User name" maxlength="20" required> <br>
            
            <input id="email" type="email" placeholder="Email" required> <br>
            
            <input id="password" type="password" placeholder="Password" minlength="8" maxlength="20" required><br>

            <input id="confirmPassword" type="password" placeholder="Confirm Password" minlength="8" maxlength="20" required><br>

            <input id="signup-button" class="button-l" type="submit" value="Register">

            <p>have an account? <a href="login.html">Login now</a></p>
        </fieldset>
    </form>


    <script>

        function signupUser() {

            var username = document.getElementById("username").value;
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirmPassword").value;

            if (username === "" || email === "" || password === "" || confirmPassword === "") {
                alert("Please fill all fields");
                return false;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match");
                return false;
            }

            var user = {
                username: username,
                email: email,
                password: password
            };

            // localStorage يخزن نص فقط → لازم نحوّل الـ object إلى نص
            var userText = JSON.stringify(user);

            // نخزن بيانات المستخدم
            localStorage.setItem("userData", userText);

            alert("Signup done! Redirecting to login page...");

            // نحول المستخدم لصفحة تسجيل الدخول
            window.location.href = "login.html";

            return false; // نمنع الفورم من التحديث الافتراضي
        }

    </script>

</body>

</html>
