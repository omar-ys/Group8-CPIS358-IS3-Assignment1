<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login page</title>
    <link rel="stylesheet" href="login&singup_style.css">
    <style>

    </style>
</head>

<body>
    <form id="login-form" method="post" onsubmit="return validateLoginForm(event)">
        <fieldset>
            <legend>Login</legend>

            <input type="text" name="name" placeholder="User name" maxlength="20"> <br>
            <input type="password" name="password" placeholder="Password" maxlength="20"> <br>

            <p id="forgotPass">
                <a class="forgotPass" href="restpassword.html">Forgot password?</a>
            </p>
            <script>
                document.getElementById("forgotPass").style.margin = "1px"
                document.getElementById("forgotPass").style.fontSize = "14px"
                document.getElementById("forgotPass").style.marginLeft = "200px"
            </script>

            <input id="login-button" class="button-l" type="submit" value="Login">

            <p>Don't have an account? <a href="signup.html">Signup now</a></p>

        </fieldset>
    </form>

    <script>
        function validateLoginForm(event) {
            event.preventDefault();

            var name = document.forms["login-form"]["name"].value;
            var password = document.forms["login-form"]["password"].value;

            if (name === "" || password === "") {
                window.alert("Please enter your name and password");
                return false;

            }
            localStorage.setItem("username", name);
            
            window.location.href = "home.html";


        }
    </script>
</body>

</html>
